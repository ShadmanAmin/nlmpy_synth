name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # nlmpy 1.2 imports numba but does not declare it as a dependency.
          pip install numba
          pip install -e ".[geo,fit,dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov=nlm_synth --cov-report=term-missing

  smoke:
    # The published entry points must work from a clean install, not just the tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numba
          pip install -e ".[geo,fit]"

      - name: Core import works without touching the geo modules
        run: python -c "import nlm_synth; print(nlm_synth.__version__)"

      - name: CLI end to end
        env:
          MPLBACKEND: Agg
        run: |
          nlm-synth --version
          nlm-synth mc --out-dir /tmp/ci-out --size 64 --runs 2 --factors 1 2 4
          test -f /tmp/ci-out/results_mc.csv

      - name: Example scripts run
        env:
          MPLBACKEND: Agg
        run: |
          python examples/run_monte_carlo.py --out-dir /tmp/ci-mc --size 64 --runs 2
          python examples/plot_parameter_sweeps.py --out-dir /tmp/ci-figs --size 64
